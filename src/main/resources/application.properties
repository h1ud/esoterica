spring.application.name=esoterica

spring.datasource.url=jdbc:postgresql://localhost:5432/dbesoterica
spring.datasource.username=postgres
spring.datasource.password=1234
# Fuerza a Hibernate a comparar las entidades frente a las tablas reales de la BD
spring.jpa.hibernate.ddl-auto=validate

# Opcional pero muy recomendado: Muestra en la consola los detalles del chequeo
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.validate-on-migrate=false

